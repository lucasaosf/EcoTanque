name: Build Android APK & Play Store Bundle (EcoTanque)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gerar APK e Pacote AAB da Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Conceder Permissão de Execução ao Gradle
        run: chmod +x frontend/android/gradlew

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Dependências do Frontend
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Compilar Frontend Web
        working-directory: frontend
        run: npm run build

      - name: Atualizar Assets Web no Android Nativo
        working-directory: frontend
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Gerar Chave Criptográfica de Assinatura (Keystore)
        run: |
          GEN_PASS=$(head /dev/urandom | tr -dc A-Za-z0-9 | head -c 24)
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore frontend/android/app/ecotanque-release.keystore \
            -alias ecotanque \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$GEN_PASS" -keypass "$GEN_PASS" \
            -dname "CN=EcoTanque, OU=Mobile, O=EcoTanque, L=Sao Paulo, ST=SP, C=BR"
          echo "RELEASE_STORE_PASSWORD=$GEN_PASS" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=$GEN_PASS" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=ecotanque" >> $GITHUB_ENV

      - name: Compilar APK Nativo Standalone com Gradle
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Compilar Pacote AAB de Produção para Google Play Store
        working-directory: frontend/android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Preparar Arquivos de Distribuição
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk EcoTanque-Combustivel-Brasil.apk
          cp frontend/android/app/build/outputs/bundle/release/app-release.aab EcoTanque-GooglePlay-Production.aab

      - name: Upload de Artefatos no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: EcoTanque-Pacotes-Android
          path: |
            EcoTanque-Combustivel-Brasil.apk
            EcoTanque-GooglePlay-Production.aab
          retention-days: 30

      - name: Publicar Release Oficial no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "⛽ EcoTanque v1.0.0 - APK Direto & Pacote Play Store (AAB)"
          body: |
            ## 📱 Pacotes de Distribuição Android - EcoTanque

            ### 1. 📥 Para Instalar Direto no Celular (APK Independente):
            * **Arquivo:** `EcoTanque-Combustivel-Brasil.apk`
            * Baixe e instale em qualquer aparelho Android (funciona em 4G, 5G ou Wi-Fi).

            ### 2. 🏪 Para Publicar na Google Play Store (App Bundle Oficial):
            * **Arquivo:** `EcoTanque-GooglePlay-Production.aab`
            * Pacote oficial assinado e otimizado no formato exigido pela Google Play Console.
            * Inclui suporte a anúncios AdMob (Free) e assinatura mensal EcoTanque PRO (R$ 14,90/mês).

            ---
            * **Versão:** 1.0.0 Oficial
            * **Compatibilidade:** Android 7.0 a Android 15 (Target SDK 35)
            * **Política de Privacidade:** [docs/index.html](https://github.com/lucasaosf/EcoTanque/blob/main/PRIVACY_POLICY.md)
          files: |
            EcoTanque-Combustivel-Brasil.apk
            EcoTanque-GooglePlay-Production.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
