name: Build Android APK (EcoTanque)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gerar APK e Publicar Release
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Conceder Permissão de Execução ao Gradle
        run: chmod +x frontend/android/gradlew

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Dependências do Frontend
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Compilar Frontend Web
        working-directory: frontend
        run: npm run build

      - name: Copiar Assets para o Android Nativo
        working-directory: frontend
        run: npx @capacitor/cli copy android

      - name: Compilar APK Nativo Standalone
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar Arquivo APK
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk EcoTanque-Combustivel-Brasil.apk

      - name: Upload de Artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: EcoTanque-Combustivel-Brasil.apk
          path: EcoTanque-Combustivel-Brasil.apk
          retention-days: 30

      - name: Publicar Release Oficial no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "⛽ EcoTanque v1.0.0 - APK Android Oficial"
          body: |
            ## 📱 Download do Aplicativo Nativo Android
            
            Este é o pacote instalável independente (**APK**) do **EcoTanque**.
            
            * **Versão:** 1.0.0 Oficial
            * **Compatibilidade:** Android 7.0 ou superior
            * **Conexão:** Funciona em 4G, 5G ou qualquer Wi-Fi
            * **Recursos:** Rastreamento GPS contínuo, rotas viárias, tempo estimado (ETA) e menores preços em tempo real
            
            ### 📥 Como Instalar:
            1. Baixe o arquivo **`EcoTanque-Combustivel-Brasil.apk`** abaixo.
            2. Toque no arquivo baixado no seu celular.
            3. Se solicitado, autorize *"Instalar de fontes desconhecidas"*.
            4. Abra o aplicativo e aproveite!
          files: EcoTanque-Combustivel-Brasil.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
